services:
  - type: web
    name: moviebrowser
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn TASK3.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: CSRF_TRUSTED_ORIGINS
        value: https://moviebrowser-aksn.onrender.com
